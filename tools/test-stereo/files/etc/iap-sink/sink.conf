# Settings for iap-sink and sink-audio. After a change run: systemctl restart iap-sink sink-audio

# 1 = press play at the start of a session when the iPod is not playing.
IAP_AUTOPLAY=1

# none = no answer to the signature challenge (no key). bogus = send an INVALID signature after 56 s.
IAP_SIGNATURE=none

# IAP_DEBUG=1

# 1 = claim the USB-A ports of the onboard hub. The kernel then does not configure the Apple device, and the
# first SET_CONFIGURATION is configuration 2, like the stereo. 0 = Linux sends configuration 1 first.
IAP_CLAIM_PORTS=1

# Playback card for the 3.5 mm jack. See: aplay -l
SINK_AUDIO_OUT=Headphones
SINK_AUDIO_RATE=44100
SINK_AUDIO_LATENCY_US=300000
# SINK_ALSALOOP_ARGS=-S 3
