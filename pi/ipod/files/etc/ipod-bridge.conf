# Settings for ipod-bridge. After a change run: systemctl restart ipod-bridge

# The name that the stereo gets from "RequestiPodName". Empty: the phone's Bluetooth name.
IPOD_NAME=

# The Bluetooth name of the Pi, as the phone shows it.
IPOD_BT_NAME=Pi iPod

# The iPod passes the stereo's authentication when no signature comes in this time.
# The stereo's MFi chip needed about 56 s in the car.
IPOD_AUTH_TIMEOUT=70s

# The Pi connects to the paired phones by itself, as a car kit does, every this many seconds
# (3 times slower after a minute without success). 0 switches it off.
IPOD_RECONNECT_EVERY=10s

# IPOD_DEBUG=1
# IPOD_TRACE_HID=0
