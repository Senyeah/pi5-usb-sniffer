# The phone's audio into the iPod USB gadget, at a fixed gain (installed by install-on-pi.sh).
# Use: ipod_gain:GAIN=<factor>. ipod-audio sets the factor from IPOD_AUDIO_GAIN_DB.
pcm.ipod_gain {
	@args [ GAIN ]
	@args.GAIN {
		type real
		default 0.5
	}
	type plug
	slave.pcm {
		type route
		slave.pcm "hw:CARD=UAC1Gadget,DEV=0"
		slave.channels 2
		ttable.0.0 $GAIN
		ttable.1.1 $GAIN
	}
}
